name: Complexity release

on:
  push:
    tags:
      - "complexity-v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

permissions: {}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Verify immutable 0.3.1 source
        if: github.event_name == 'workflow_dispatch' && env.RELEASE_TAG == 'complexity-v0.3.1'
        shell: bash
        run: test "$(git rev-parse HEAD)" = "d1d6309386e095b8daaf06a83898ecfca985d909"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Validate the release tag
        run: python3 release/package.py validate-tag --tag "$RELEASE_TAG"

      - name: Check out corrected release tests
        if: github.event_name == 'workflow_dispatch' && env.RELEASE_TAG == 'complexity-v0.3.1'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: 4d4fadd951ffd468d0ad8eedde69ef04357a8439
          path: .release-validation

      - name: Overlay corrected 0.3.1 tests
        if: github.event_name == 'workflow_dispatch' && env.RELEASE_TAG == 'complexity-v0.3.1'
        shell: bash
        run: |
          cp .release-validation/tests/javascript.rs tests/javascript.rs
          cp .release-validation/agent/skills/complexity-cli/scripts/test_check_complexity.py agent/skills/complexity-cli/scripts/test_check_complexity.py

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: cargo test --locked --all-targets

      - name: Check release hook budget
        run: >-
          cargo test --release --locked --test javascript
          within_the_hook_budget -- --test-threads=1

      - name: Build the validation binary
        run: cargo build --locked --bin complexity

      - name: Set up Node.js for Promptfoo
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"

      - name: Install the locked Promptfoo dependency
        run: >-
          npm ci --prefix agent/eval --ignore-scripts --no-audit --no-fund

      - name: Test the release packager
        env:
          COMPLEXITY_BIN: target/debug/complexity
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s release/tests -p "test_*.py"

      - name: Test the agent skill and hooks
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s agent/skills/complexity-cli/scripts -p "test_*.py"

      - name: Test the manual Codex eval harness
        env:
          COMPLEXITY_BIN: ../../target/debug/complexity
        run: npm run test --prefix agent/eval

      - name: Validate the manual Codex eval config
        run: npm run validate --prefix agent/eval

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: target/x86_64-unknown-linux-gnu/release/complexity
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            binary: target/aarch64-unknown-linux-gnu/release/complexity
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            binary: target/x86_64-apple-darwin/release/complexity
          - runner: macos-15
            target: aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/release/complexity
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/release/complexity.exe
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Verify immutable 0.3.1 source
        if: github.event_name == 'workflow_dispatch' && env.RELEASE_TAG == 'complexity-v0.3.1'
        shell: bash
        run: test "$(git rev-parse HEAD)" = "d1d6309386e095b8daaf06a83898ecfca985d909"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Add the Rust target
        run: rustup target add "${{ matrix.target }}"

      - name: Build the native binary
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Test both Windows plugin hook samples
        if: runner.os == 'Windows' && env.RELEASE_TAG != 'complexity-v0.3.1'
        env:
          COMPLEXITY_BIN: ${{ matrix.binary }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: py -3 -m unittest release.tests.test_plugin_package.PluginPackageTests.test_each_windows_hook_sample_runs_the_packaged_checker

      - name: Build the release package
        shell: bash
        run: >-
          python release/package.py package
          --tag "$RELEASE_TAG"
          --target "${{ matrix.target }}"
          --binary "${{ matrix.binary }}"
          --output-dir dist

      - name: Upload the immutable package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: complexity-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  release:
    name: Create GitHub Release
    needs:
      - validate
      - build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download all native packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: complexity-*
          path: dist
          merge-multiple: true

      - name: Verify package checksums
        working-directory: dist
        run: sha256sum --check --strict complexity-*.sha256

      - name: Create the release after every build passes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$RELEASE_TAG"
          --repo "${{ github.repository }}"
          --verify-tag
          --title "$RELEASE_TAG"
          --generate-notes
          dist/*
